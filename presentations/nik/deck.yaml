# presentations/nik/deck.yaml
# gbt2026 deck for Nik. Draft converted from the previous demo's scene list.
# Layer ids refer to entries in data/manifest.yaml.

title: gbt2026 (Nik)
default_hemisphere: left        # left | right | both  (say "right" or "both" to override)
default_view: left
default_layout: conventional

# ---------------------------------------------------------------- layers
layers:
  cortex_coloured: {source: fsaverage, parcellation: desikan, shade_sulci: true}
  cortex_glass:    {source: fsaverage, style: glass, opacity: 0.25}
  cortex_inflated: {source: fsaverage, surface: inflated}
  gyri_ang_smg:    {source: spl_atlas, labels: [angular, supramarginal], style: highlight}
  arcuate:         {source: org, tract: arcuate,  sample: display}
  ifof:            {source: org, tract: ifof,     sample: display}
  ilf:             {source: org, tract: ilf,      sample: display}
  slf:             {source: org, tract: slf,      sample: display}
  splenium:        {source: org, tract: splenium, sample: display}
  optic_radiation: {source: hcp1065, tract: optic_radiation, color: lime}
  meyers_loop:     {source: consult, map: meyers_loop, generate_fibres: true, color: pink}
  t1_slices:       {source: org_t1, style: slice_planes}

# ---------------------------------------------------------------- scenes
scenes:
  - {name: gyri,        say: ["gyri"],                         layers: [cortex_coloured]}
  - {name: glass,       say: ["glass brain"],                  layers: [cortex_glass]}
  - {name: inflated,    say: ["inflated"],                     layers: [cortex_inflated]}
  - {name: angular_smg, say: ["angular and supramarginal"],    layers: [cortex_glass, gyri_ang_smg]}
  - {name: arcuate,     say: ["arcuate"],                      layers: [arcuate]}
  - {name: ifof,        say: ["IFOF"],                         layers: [ifof]}
  - {name: ilf,         say: ["ILF"],                          layers: [ilf]}
  - {name: slf,         say: ["SLF"],                          layers: [slf]}
  - {name: splenium,    say: ["splenium"],                     layers: [splenium]}
  - {name: optic_radiation, say: ["optic radiation"],          layers: [optic_radiation]}
  - {name: meyers_loop, say: ["Meyer's loop"],                 layers: [meyers_loop]}
  - {name: visual_pathway, say: ["visual pathway"],            layers: [cortex_glass, optic_radiation, meyers_loop]}
  - {name: language,    say: ["language tracts"],              layers: [cortex_glass, arcuate, ifof, ilf]}
  - {name: all_tracts,  say: ["all tracts"],                   layers: [arcuate, ifof, ilf, slf, splenium]}
  - {name: wow,         say: ["wow"],                          layers: [cortex_glass, arcuate, ifof, ilf, slf, splenium]}
  - {name: full,        say: ["full"],                         hemisphere: both,
                        layers: [cortex_glass, arcuate, ifof, ilf, slf, splenium, t1_slices]}

# ---------------------------------------------------------------- camera and layout
camera:
  views: [left, right, top, front, back, bottom]   # "look from <view>"
  spin: true                                       # "spin on" / "spin off"
  t1_toggle: t1_slices                             # "show the T1" / "hide the T1"
  glass_opacity: {min: 0.05, max: 0.8, step: 0.05} # "glass more / less transparent" + slider
layouts: [four_views, 3d_only, conventional]

# ---------------------------------------------------------------- flow
flow: [gyri, glass, angular_smg, arcuate, ifof, ilf, slf, splenium, visual_pathway, language, wow]  # "next" / "back"
reset: {layout: conventional, scene: wow, view: left}

# ---------------------------------------------------------------- panel
panel:
  title: gbt2026
  rows: [hemisphere, cortex, tracts, visual, combined, view, layout, flow, opacity]

# ---------------------------------------------------------------- slide credits and caveats
caveats:
  - "White-matter tracts (SLF, arcuate, IFOF, ILF, splenium): ORG atlas, streamlines sampled for display."
  - "Optic radiation: HCP1065 atlas (Yeh et al.), streamlines ending at about y=-18 mm in MNI."
  - "Meyer's loop: CONSULT population probability maps (NeuroVault collection 11045); fibres generated from the volume, not measured. Citation and licence not stated on the NeuroVault page."
  - "Cortex: FreeSurfer fsaverage (population average), fitted to the ORG T1 by bounding box; approximate, not the same brain as the tracts."
  - "Angular and supramarginal gyri: SPL/NAC atlas, a different brain again; approximate position."
  - "All atlases fitted to the ORG T1 approximately."
