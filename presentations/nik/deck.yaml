# presentations/nik/deck.yaml
# The talk script for Nik: which scenes exist, in what order, what to say, and what to credit on the slides.
# Tract keys are the ones used by the panel buttons (gbt/layout.py, actions "tract:<key>").
# Run `python scripts/doctor.py` to check that every key and scene name here exists.

title: gbt2026 (Nik)
default_side: left          # left | right | both  (the Left / Right / Both buttons)
default_view: left          # camera direction at the start and after "Reset"

# ---------------------------------------------------------------- what each tract button shows
# source = where the streamlines come from, note = what to say on the slide when it matters.
tracts:
  arcuate:   {label: Arcuate fasciculus,           source: ORG}
  ifof:      {label: IFOF,                         source: ORG}
  ilf:       {label: ILF,                          source: ORG}
  slf1:      {label: SLF I,                        source: ORG}
  slf2:      {label: SLF II,                       source: ORG}
  slf3:      {label: SLF III,                      source: ORG}
  uf:        {label: Uncinate fasciculus,          source: ORG}
  mdlf:      {label: Middle longitudinal fasciculus, source: ORG}
  vof:       {label: Vertical occipital fasciculus, source: HCP1065}
  ec:        {label: External capsule,             source: ORG}
  cst:       {label: Corticospinal tract,          source: ORG}
  fstr:      {label: Frontostriatal tract,         source: ORG}
  ic_ant:    {label: Internal capsule - anterior limb,    source: derived, note: "ORG projection fibres assigned by where they pass the lentiform nucleus; not an atlas label"}
  ic_genu:   {label: Internal capsule - genu,             source: derived}
  ic_post:   {label: Internal capsule - posterior limb,   source: derived}
  ic_retro:  {label: Internal capsule - retrolenticular,  source: derived}
  ic_sub:    {label: Internal capsule - sublenticular,    source: derived, note: few fibres; auditory radiation is not in the atlas}
  ic:        {label: Internal capsule - all parts,        source: derived, note: composite of the five parts}
  cr:        {label: Corona radiata,               source: ORG, note: frontal and parietal parts}
  splenium:  {label: Splenium of the corpus callosum, source: ORG (CC7)}
  tapetum:   {label: Tapetum,                      source: derived, note: "not in any atlas; approximated from the lateral fibres of the ORG splenium (CC6/CC7)"}
  optic:     {label: Optic radiation,              source: HCP1065}
  meyer:     {label: Meyer's loop,                 source: CONSULT, note: "generated from population probability maps, not measured fibres"}
  sagittal:  {label: Sagittal stratum,             source: composite, note: "IFOF + ILF + optic radiation shown together; not an atlas tract"}
  ventricles: {label: Ventricles,                  source: SPL atlas}
  bg:        {label: Basal ganglia,                source: SPL atlas, note: caudate, putamen, globus pallidus}
  brainstem: {label: Brainstem,                    source: SPL atlas, note: midbrain, pons, medulla}

# ---------------------------------------------------------------- scenes (presets for the flow, voice and Claude)
# surface: gyri | glass | inflated        tracts: keys from above        extra: angular | planes
scenes:
  - {name: gyri,      say: ["gyri"],                          surface: gyri}
  - {name: glass,     say: ["glass brain"],                   surface: glass}
  - {name: inflated,  say: ["inflated"],                      surface: inflated}
  - {name: angular,   say: ["angular and supramarginal"],     surface: glass, extra: angular}
  - {name: arcuate,   say: ["arcuate"],                       tracts: [arcuate]}
  - {name: ifof,      say: ["IFOF"],                          tracts: [ifof]}
  - {name: ilf,       say: ["ILF"],                           tracts: [ilf]}
  - {name: slf,       say: ["SLF"],                           tracts: [slf1, slf2, slf3]}
  - {name: splenium,  say: ["splenium"],                      tracts: [splenium]}
  - {name: visual,    say: ["visual pathway"],                surface: glass, tracts: [optic, meyer]}
  - {name: lang,      say: ["language tracts"],               surface: glass, tracts: [arcuate, ifof, ilf]}
  - {name: tracts,    say: ["all tracts"],                    tracts: [slf1, slf2, slf3, arcuate, ifof, ilf, splenium]}
  - {name: wow,       say: ["wow"],                           surface: glass, tracts: [slf1, slf2, slf3, arcuate, ifof, ilf, splenium]}
  - {name: full,      say: ["full"],                          side: both, surface: glass,
                      tracts: [slf1, slf2, slf3, arcuate, ifof, ilf, splenium, optic, meyer], extra: planes}

# "next" / "back" walk this list; "reset" returns to the first scene of the talk
flow: [gyri, glass, angular, arcuate, ifof, ilf, slf, splenium, visual, lang, wow]
reset: {scene: wow, view: left}

# ---------------------------------------------------------------- slide credits and caveats
caveats:
  - "White-matter tracts: ORG atlas (Zhang et al.), streamlines sampled for display (100-260 per side), drawn as thin tubes."
  - "Vertical occipital fasciculus and optic radiation: HCP1065 atlas (Yeh et al.), placed on the ORG brain by the ICBM-to-ORG transform."
  - "Meyer's loop: CONSULT population probability maps (NeuroVault collection 11045); fibres generated from the volume, not measured. Citation and licence not stated on the NeuroVault page."
  - "Tapetum: derived from the lateral fibres of the ORG splenium (CC6/CC7); an approximation, not an atlas tract."
  - "Sagittal stratum: a composite of IFOF, ILF and optic radiation."
  - "Internal capsule parts: derived by me from ORG projection tracts (CST, PLIC, corona radiata, thalamic radiations), split by where each fibre passes the lentiform nucleus; the atlas has no separate anterior limb, genu, retrolenticular or sublenticular labels."
  - "Cortex: FreeSurfer fsaverage (population average), scaled x1.076 to the extent of the ORG T1 brain; a different brain from the tracts, so endpoints do not land on exact gyri."
  - "Ventricles, basal ganglia, brainstem, subject T1 and angular/supramarginal gyri: SPL brain atlas (a single subject), fitted to the ORG space by an affine transform; approximate position."
